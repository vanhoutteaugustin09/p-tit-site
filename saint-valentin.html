<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Mon site</title>

  <!-- Police romantique -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(135deg, #ff4b6e, #ff1a1a, #ff9a9e);
      display: flex; justify-content: center; align-items: center;
    }

    .container {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; padding: 20px; text-align: center; width: 100%;
      max-width: 900px; box-sizing: border-box;
    }

    h1 { margin: 0; font-size: 70px; color: #fff; line-height: 1; }
    .centre { margin: 0; padding: 0; line-height: 1.05; font-size: 40px; color: #fff;
      display:flex; flex-direction:column; align-items:center; gap:6px; }
    .centre p { margin: 0; padding: 0; }

    .boutons {
      margin-top: 6px;
      display: flex; justify-content: center; gap: 20px;
    }

    .boutons button {
      font-size: 24px; padding: 12px 28px; border: none; border-radius: 12px;
      cursor: pointer; color: white; transition: transform 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .btn-oui { background-color: #28a745; }
    .btn-non { background-color: #dc3545; }

    .boutons button:focus { outline: 3px solid rgba(255,255,255,0.25); transform: translateY(-2px); }

    /* Modal */
    .modal {
      position: fixed; inset: 0; display: none; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.45); z-index: 50;
    }
    .modal .card {
      background: rgba(255,255,255,0.98); color: #111; padding: 28px; border-radius: 14px;
      max-width: 520px; width: calc(100% - 40px); text-align: center; font-family: Arial, sans-serif;
    }
    .modal .card h2 { margin: 0 0 8px 0; font-family: 'Great Vibes', cursive; font-size: 48px; }
    .modal .card p { margin: 0 0 16px 0; }

    .close-btn { background:#333; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; }

    /* Confetti */
    .confetti-piece {
      position: fixed; width: 10px; height: 14px; opacity: 0.95; z-index: 60;
      will-change: transform, opacity;
    }

    /* Small hearts animation behind modal text */
    .hearts {
      position: absolute; inset: 0; pointer-events: none; overflow: visible;
    }
    .heart {
      position: absolute; width: 18px; height: 18px; transform: translate(-50%,-50%) scale(0.9);
      background: radial-gradient(circle at 30% 30%, #fff 0 10%, transparent 11%),
                  linear-gradient(45deg, #ff6b6b, #ff1a1a);
      clip-path: path('M10 3 C 6 -1, 0 1, 0 6 C 0 11, 10 16, 10 16 C 10 16, 20 11, 20 6 C 20 1, 14 -1, 10 3 Z');
      opacity: 0.95;
      animation: floatUp 1600ms ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 1; }
      100% { transform: translateY(-220px) scale(1.1); opacity: 0; }
    }

    @media (max-width:600px) {
      h1 { font-size: 48px; } .centre { font-size: 24px; } .boutons button { font-size: 18px; padding: 10px 20px; }
    }
  </style>
</head>
<body>

  <div class="container" role="main" aria-labelledby="titre">
    <h1 id="titre">Coucou ma Romane</h1>

    <div class="centre" id="texte">
      <p>J'ai une petite question pour toi :</p>
      <p>Veux tu être ma valentine ?</p>
    </div>

    <div class="boutons" id="actions">
      <button class="btn-oui" id="ouiBtn" aria-label="Oui, je veux">Oui ❤️</button>
      <button class="btn-non" id="nonBtn" aria-label="Non, désolé">Non 😢</button>
    </div>
  </div>

  <!-- Modal de confirmation -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="card" role="document">
      <h2>Merci ❤️</h2>
      <p>Tu rends ma journée merveilleuse. Je serais trop content de partager ce moment avec toi !</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="close-btn" id="modalClose">Fermer</button>
        <button class="close-btn" id="mailtoBtn">Envoyer un mail</button>
      </div>
      <div class="hearts" id="hearts"></div>
    </div>
  </div>

  <script>
    /* Références */
    const ouiBtn = document.getElementById('ouiBtn');
    const nonBtn = document.getElementById('nonBtn');
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');
    const mailtoBtn = document.getElementById('mailtoBtn');
    const heartsContainer = document.getElementById('hearts');

    /* --- Son simple (WebAudio) --- */
    function playPop() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
        o.connect(g); g.connect(ctx.destination);
        o.start();
        o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.18);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        o.stop(ctx.currentTime + 0.6);
      } catch (e) { /* silence si non supporté */ }
    }

    /* --- Confettis simples --- */
    function launchConfetti(count = 28) {
      const colors = ['#ff4b6e','#ff9a9e','#ffd1dc','#fff176','#ff6b6b','#ff1a1a'];
      for (let i=0;i<count;i++){
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (50 + (Math.random()-0.5)*60) + '%';
        el.style.top = (50 + (Math.random()-0.5)*10) + '%';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(el);

        const dx = (Math.random()-0.5)*120;
        const dy = - (200 + Math.random()*400);
        const rot = (Math.random()>0.5?1:-1) * (200 + Math.random()*400);

        el.animate([
          { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
        ], {
          duration: 1200 + Math.random()*800,
          easing: 'cubic-bezier(.2,.8,.2,1)'
        });

        setTimeout(()=> el.remove(), 2200);
      }
    }

    /* --- Petits coeurs dans la modal --- */
    function spawnHearts(n=8) {
      for (let i=0;i<n;i++){
        const h = document.createElement('div');
        h.className = 'heart';
        h.style.left = (20 + Math.random()*60) + '%';
        h.style.top = (60 + Math.random()*20) + '%';
        heartsContainer.appendChild(h);
        setTimeout(()=> h.remove(), 1600);
      }
    }

    /* --- OUI : ouvre modal + confetti + son --- */
    ouiBtn.addEventListener('click', () => {
      playPop();
      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden','false');
      launchConfetti(36);
      spawnHearts(10);
    });

    modalClose.addEventListener('click', () => {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden','true');
    });

    /* mailto fallback (ouvre le client mail) */
    mailtoBtn.addEventListener('click', () => {
      const subject = encodeURIComponent("Oui, je veux être ta valentine ❤️");
      const body = encodeURIComponent("ouiiiiiiiiiiiii !!!!!!!");
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    /* --- NON : bouton qui s'échappe --- */
    function moveButtonFar(btn) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const btnRect = btn.getBoundingClientRect();
  const padding = 24;

  // Calcul d'une position aléatoire dans la fenêtre (en évitant les bords)
  const targetX = Math.floor(padding + Math.random() * (vw - btnRect.width - padding * 2));
  const targetY = Math.floor(padding + Math.random() * (vh - btnRect.height - padding * 2));

  // Passe le bouton en position fixed pour le déplacer librement sur l'écran
  btn.style.position = 'fixed';
  btn.style.zIndex = 9999;
  btn.style.left = `${targetX}px`;
  btn.style.top = `${targetY}px`;
  btn.style.transition = 'left 360ms cubic-bezier(.2,.9,.2,1), top 360ms cubic-bezier(.2,.9,.2,1)';

  // Optionnel : ajoute un petit "saut" supplémentaire après la première translation
  setTimeout(() => {
    if (Math.random() > 0.45) { // ~45% de chances d'un second saut
      const extraX = Math.floor(padding + Math.random() * (vw - btnRect.width - padding * 2));
      const extraY = Math.floor(padding + Math.random() * (vh - btnRect.height - padding * 2));
      btn.style.left = `${extraX}px`;
      btn.style.top = `${extraY}px`;
    }
  }, 380);
}

// Écouteur : déclenche le déplacement à l'approche du curseur
nonBtn.addEventListener('mouseenter', () => {
  moveButtonFar(nonBtn);
});

    /* --- Keyboard support: Enter/Space on focused buttons --- */
    [ouiBtn, nonBtn].forEach(b => {
      b.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          b.click();
        }
      });
    });

    /* --- Optionnel : empêcher le bouton Non d'être cliqué facilement --- */
    nonBtn.addEventListener('click', () => {
      // petit effet si elle réussit à cliquer
      playPop();
      nonBtn.style.transform = 'scale(0.95)';
      setTimeout(()=> nonBtn.style.transform = '', 220);
    });

    /* --- Close modal on Escape --- */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden','true');
      }
    });

    /* --- Astuce : si tu veux rediriger après Oui (ex: page de célébration) :
         remplace la ligne dans l'écouteur ouiBtn par : window.location.href = 'celebration.html';
    */
  </script>
</body>
</html>
